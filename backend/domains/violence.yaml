id: violence
label: Agresion y rina
description: >
  Detecta agresiones fisicas en espacios publicos: transporte, campus, eventos.
  Combina energia de movimiento con cercania entre dos personas.

threshold: 0.55
sustain_seconds: 0.5
cooldown_seconds: 15
min_track_seconds: 1.0

weights:
  motion: 0.55
  proximity: 0.45

# Sin `require`. Medido sobre 358 clips de CCTV real: exigir motion >= 0.42 Y
# proximity >= 0.38 silenciaba 20 de 112 agresiones por completo, no las
# puntuaba bajo. Eso clavaba el techo de recall en 79.5% hiciera lo que
# hiciera el umbral. Sin la puerta AND el techo sube a ~97%.
#
# Un falso positivo de mas solo cuesta una llamada al VLM, que descarta;
# un falso negativo aqui no lo recupera nadie.

vlm:
  taxonomy:
    - agresion fisica
    - forcejeo o empujon
    - amenaza con objeto
    # Sin esta opcion, alguien que se desploma solo delante de esta camara
    # obligaba al modelo a elegir entre "agresion fisica", que es falso, e
    # "interaccion no violenta", que esta en NO_INCIDENTE y descarta el
    # incidente entero. Una urgencia medica se perdia en silencio. El tipo
    # manda sobre el dominio, asi que esto entra en Convex como `fall`.
    - caida o accidente
    - interaccion no violenta
    - ninguno
  focus: >
    Distingue una agresion real de un saludo efusivo, un abrazo, un choque de
    manos, gente bailando o jugando. Busca golpes dirigidos, empujones,
    agarres del cuello o la ropa, y personas que retroceden o caen. Si las dos
    personas mantienen postura relajada y sonrien, no es incidente.

    Antes de llamarlo agresion, comprueba que alguien la ejerce. Si la persona
    cae sin que nadie la toque (tropiezo, resbalon, desvanecimiento) o queda
    en el suelo estando sola, responde "caida o accidente": sigue necesitando
    atencion inmediata, pero no es lo mismo y no debe registrarse como tal.
