id: retail_theft
label: Robo en tienda
description: >
  Detecta ocultamiento de producto en ropa, bolsos o carritos. El disparo busca
  el patron de alcanzar un estante y llevar la mano al torso, no la identidad
  de la persona.

threshold: 0.52
sustain_seconds: 0.7
cooldown_seconds: 25
min_track_seconds: 2.0

weights:
  concealment: 0.62
  dwell: 0.26
  motion: 0.12

# Sin `require`. Medido sobre 182 clips reales: exigir concealment >= 0.34
# silenciaba 16 de 92 robos por completo (76 puntuaban con el requisito, 92
# sin el). Mismo fallo que tenia el dominio de violencia: una puerta AND no
# baja la puntuacion, la hace invisible, y lo que no ve el gate no lo
# recupera la Etapa 2.

# Candidata en evaluacion: se mide pero todavia no puntua. El barrido visual
# separa muy bien en simulacion, pero un cliente que busca un producto
# tambien mira alrededor; hasta tener datos reales no toca el score.
report:
  - scanning

vlm:
  taxonomy:
    - ocultamiento de producto
    - sustraccion sin pago
    - manipulacion de envase o etiqueta
    # Mismo motivo que en agresion: un cliente que se desploma en el pasillo
    # tenia como unica salida "comportamiento normal de compra", que descarta
    # el incidente. La tienda es justo donde alguien puede caerse y quedarse
    # solo un buen rato.
    - caida o accidente
    - comportamiento normal de compra
    - ninguno
  focus: >
    Fijate en las manos del sujeto marcado y en si un producto pasa del estante
    a su ropa, bolso, carrito o cuerpo y NO vuelve al estante ni a una cesta de
    compra visible. Coger un producto, mirarlo y devolverlo es comportamiento
    normal. Meterlo en una cesta o carrito de la tienda tambien es normal.
    Solo es incidente si el producto queda oculto sobre el cuerpo o dentro de
    un bolso personal.

    Si lo que ves es una persona que cae o queda tendida en el suelo, eso no
    es un robo: responde "caida o accidente". Atender a alguien en el suelo
    importa mas que un producto.
